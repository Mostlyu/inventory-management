
services:

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  db:
    image: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MARIADB_MYSQL_LOCALHOST_USER: "true"
      MARIADB_DATABASE: mydb
    command: --ssl=0
    volumes:
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d

  inventory_app:
    build: .
    ports:
      - 8000:80
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    env_file:
      - .env

volumes:
  db_data:
